<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <title id="pageTitle" th:text="#{page_label_new_todo_task} + ' - ' + #{application_name}"></title>
  <th:block th:include="fragments.html :: header"/>
</head>

<!-- Navigation -->
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top" th:insert="fragments.html :: navigation"></nav>

<!-- Page Content -->
<section class="main">
  <div sec:authorize="isAuthenticated()" class="wrapper">
    <div class="left-col">
      <div class="frame-title-create-form">
        <p class="logo-title-text-create-form" th:text="#{page_label_new_todo_task}"></p>
      </div>
      <div class="frame-content-create-form">
        <div class="form-create">
          <form method="POST" th:action="@{/todo/add}">
            <input name="todoText" class="input-fields" th:placeholder="#{input_enter_todo_text}" />
            <input name="deadlineAt" class="input-fields" type="datetime-local" />
            <button type="submit" class="btn-create" th:text="#{button_add_todo_task}"></button>
          </form>
        </div>
      </div>

      <!-- Footer -->
      <footer th:insert="fragments.html :: footer"></footer>
    </div>

    <!-- Right Column -->
    <div th:insert="fragments.html :: right-column"></div>
  </div>
</section>

</body>
</html>
