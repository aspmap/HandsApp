<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title id="pageTitle" th:text="#{application_name} + ' - ' + #{page_label_add_permission}"></title>
    <th:block th:include="fragments.html :: header-add-img"/>
    <link th:href="@{/resources/css/add-permission.css}" rel="stylesheet">
    <script type="text/javascript" th:src="@{/resources/js/add-permission.js}"></script>
</head>

<!-- Navigation -->
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top"
     th:insert="fragments.html :: navigation-add-img"></nav>

<!-- Page Content -->
<section class="main-post">
    <div class="wrapper-posts">
        <div class="left-col">
            <div class="search_box">
                <br/>
                <br/>
                <br/>
                <form method="POST" th:action="@{/wishlist/permissions/add}">
                    <input type="hidden" name="wishlistIdWishlistPrivate" th:value="${id}"/>
                    <input name="userWishlistPrivate" id="search" class="profile-box description" th:placeholder="#{input_enter_username_wish}"/>
                    <div id="search_box-result"></div>
                    <button type="submit" class="btn btn-outline-dark" th:text="#{button_add_permission}"></button>
                </form>
            </div>

            <!-- Footer -->
            <footer th:insert="fragments.html :: footer"></footer>

        </div>
    </div>
</section>

</body>
</html>
