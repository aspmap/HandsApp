<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title id="pageTitle" th:text="#{application_name} + ' - ' + #{page_label_dialogues}"></title>
    <th:block th:include="fragments.html :: header"/>
</head>

<!-- Navigation -->
<body>
<nav class="navbar" th:insert="fragments.html :: navigation"></nav>

<!-- Page Content -->
<section class="main">
    <div class="wrapper">
        <div class="left-col">

            <!-- Dialogs -->
            <div class="post">
                <div class="info">
                    <div class="user">
                        <p class="comments-logo" th:text="#{text_dialogs}"></p>
                    </div>
                </div>
            </div>
            <div class="post">
                <div class="post-content">
                    <div class="view-source comments-view">
                        <div th:if="${dialogs.size() > 0}" th:each="dialogs_view: ${dialogs}">
                            <div class="media-body">
                                <div class="info-comments">
                                    <div class="user-comments">
                                        <div class="profile-card">
                                            <div class="profile-pic-comments">
                                                <a th:href="@{/messages/{dialogId}(dialogId = ${dialogs_view.getKey()})}">
                                                    <img th:src="@{'/resources/img/users/' + ${dialogs_view.getValue().username} + '/profile/' + ${dialogs_view.getValue().photo}}"
                                                         alt="">
                                                </a>
                                            </div>
                                            <div>
                                                <a th:href="@{/messages/{dialogId}(dialogId = ${dialogs_view.getKey()})}">
                                                    <p th:text="${dialogs_view.getValue().username}"
                                                       class="username"></p>
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div th:if="${dialogs.size() == 0}">
                            <div class="media-body">
                                <div class="view-source comments-view">
                                    <br><br><br>
                                    <h1 class="h3 mb-3 font-weight-normal text-center"
                                        th:text="#{text_no_dialogues}"></h1>
                                    <br><br><br>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer th:insert="fragments.html :: footer"></footer>

        </div>

        <!-- Right Column -->
        <div th:insert="fragments.html :: right-column"></div>
    </div>
</section>

<!-- Bootstrap core JavaScript -->
<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
