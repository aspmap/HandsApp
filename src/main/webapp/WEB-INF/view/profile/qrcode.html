<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
  <title id="pageTitle" th:text="#{page_label_qr_code} + ' - ' + #{application_name}"></title>
  <th:block th:include="fragments.html :: header"/>
</head>

<!-- Navigation -->
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top" th:insert="fragments.html :: navigation"></nav>

<!-- Page Content -->
<section class="main">
  <div class="wrapper">
    <div class="left-col">
      <div class="post">
        <div class="info">
          <div class="user">
            <p class="comments-logo" th:text="#{menu_qrcode}"></p>
          </div>
        </div>
      </div>
      <div class="post">
        <div class="post-content qrcode-position">
          <div class="view-source comments-view qrcode-view">
              <img th:src="*{'data:image/png;base64,'+ qrQode}" alt="" />
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer th:insert="fragments.html :: footer"></footer>

    </div>

    <!-- Right Column -->
    <div th:insert="fragments.html :: right-column"></div>

    </div>
  </div>
</section>

</body>
</html>
