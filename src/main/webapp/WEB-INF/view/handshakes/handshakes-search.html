<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title id="pageTitle" th:text="#{page_label_handshakes} + ' - ' + #{application_name}"></title>
    <th:block th:include="fragments.html :: header"/>
</head>

<!-- Navigation -->
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top" th:insert="fragments.html :: navigation"></nav>

<!-- Page Content -->
<section class="main" sec:authorize="isAuthenticated()">
    <div class="wrapper">
        <div class="left-col">
            <div class="frame-title-create-form">
                <p class="logo-title-text-create-form" th:text="#{text_handshakes}"></p>
            </div>
            <div class="frame-content-create-form">
                <div class="form-create">
                    <p class="main-text" th:text="#{text_handshakes_description1}"></p>
                    <p class="main-text-bold"><span th:text="#{text_handshakes_description2}"></span></p>
                </div>
            </div>

            <div class="frame-content-create-form">
                <div class="form-create">
                    <div class="search_box">
                        <form method="POST" th:action="@{/handshakes_results}">
                            <input type="text" class="input-fields" id="search" name="searchUsername" th:placeholder="#{input_find_handshakes}" maxlength="255" required>
                            <div id="search_box-result"></div>
                            <button type="submit" class="btn-create" th:text="#{button_search_handshakes}"></button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer th:insert="fragments.html :: footer"></footer>
        </div>

        <!-- Right Column -->
        <div th:insert="fragments.html :: right-column"></div>
    </div>
</section>

</body>
</html>
