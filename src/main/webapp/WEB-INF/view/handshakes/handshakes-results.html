<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title id="pageTitle" th:text="#{page_label_search_results_for_connections} + ' - ' + #{application_name}"></title>
    <th:block th:include="fragments.html :: header"/>
</head>

<!-- Navigation -->
<body>
<nav class="navbar" th:insert="fragments.html :: navigation"></nav>

<!-- Page Content -->
<section class="main">
    <div class="wrapper">
        <div class="left-col">

            <!-- Results -->
            <div class="post">
                <div class="info">
                    <div class="user">
                        <p class="comments-logo" th:text="#{text_found_handshakes}"></p>
                    </div>
                </div>
            </div>
            <div class="post">
                <div class="post-content">
                    <div class="view-source comments-view">
                        <div class="media-body">
                            <div class="info-comments">
                                <div class="user-comments">
                                    <div class="profile-card">
                                        <div  th:if="${pathOfUsers.isEmpty()}">
                                            <b class="description-comments-user">
                                                <span th:text="#{text_handshakes_results_not_found1} + ' '"></span>
                                                <a th:href="@{/posts_sub/{user}(user = ${searchUsername})}">
                                                    <b class="description-handshakes-user">
                                                        <span th:text="${searchUsername}"></span>
                                                    </b>
                                                </a>
                                                <span th:text="#{text_handshakes_results_not_found2}"></span>
                                            </b>
                                        </div>
                                        <div  th:if="${!pathOfUsers.isEmpty()}">
                                            <b class="description-comments-user">
                                                <span th:text="#{text_handshakes_results_found1} + ' '"></span>
                                                <a th:href="@{/posts_sub/{user}(user = ${searchUsername})}">
                                                    <b class="description-handshakes-user">
                                                        <span th:text="${searchUsername}"></span>
                                                    </b>
                                                </a>
                                                <span th:if="${countHandshakes == 1}" th:text="#{text_handshakes_results_found2} + ' ' + ${countHandshakes} + ' ' + #{text_handshakes_results_found3}"></span>
                                                <span th:if="${countHandshakes > 1 and countHandshakes < 5}" th:text="#{text_handshakes_results_found2} + ' ' + ${countHandshakes} + ' ' + #{text_handshakes_results_found4}"></span>
                                                <span th:if="${countHandshakes > 4 and countHandshakes < 7}" th:text="#{text_handshakes_results_found2} + ' ' + ${countHandshakes} + ' ' + #{text_handshakes_results_found5}"></span>
                                            </b>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="handshakes" th:if="${!pathOfUsers.isEmpty()}">
                <div class="handshakes-content">
                    <div class="view-source handshakes-view">
                        <table>
                            <tr>
                                <div th:if="${linkUsersResults != '0'}" th:each="linkUsersResults: ${pathOfUsersVisual}">
                                    <td>
                                        <div class="handshakes-tree">
                                            <div class="handshakes-comments">
                                                <div class="handshakes-profile-card">
                                                    <div class="profile-pic-handshakes">
                                                        <a th:href="@{/posts_sub/{user}(user = ${linkUsersResults.username})}">
                                                            <img th:if="${linkUsersResults == 'null'}" th:src="@{'/resources/img/icons/avatar.jpg'}" alt="">
                                                            <img th:if="${linkUsersResults.photo != null and linkUsersResults.isGoogle == false}" th:src="@{'/resources/img/users/' + ${linkUsersResults.username} + '/profile/' + ${linkUsersResults.photo}}" alt="">
                                                            <img th:if="${linkUsersResults.photo != null and linkUsersResults.isGoogle == true}" th:src="${linkUsersResults.photo}" alt="">
                                                        </a>
                                                    </div>
                                                    <div>
                                                        <a th:if="${linkUsersResults.isGoogle == false}" th:href="@{/posts_sub/{user}(user = ${linkUsersResults.username})}">
                                                            <b class="description-handshakes-user">
                                                                <span th:text="${linkUsersResults.username}"></span>
                                                            </b>
                                                        </a>
                                                        <a th:if="${linkUsersResults.isGoogle == true}" th:href="@{/posts_sub/{user}(user = ${linkUsersResults.username})}">
                                                            <b class="description-handshakes-user">
                                                                <span th:text="${linkUsersResults.email}"></span>
                                                            </b>
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </td>

                                    <td class="img-position">
                                        <img class="arrow-size" th:src="@{'/resources/img/nav/arrow-right.png'}" alt="">
                                    </td>
                                </div>
                                <div>
                                    <td>
                                        <div class="handshakes-tree">
                                            <div class="handshakes-comments">
                                                <div class="handshakes-profile-card">
                                                    <div class="profile-pic-handshakes">
                                                        <a th:href="@{/posts_sub/{user}(user = ${searchUsername})}">
                                                            <img th:if="${searchUserinfo.photo == null}" th:src="@{'/resources/img/icons/avatar.jpg'}" alt="">
                                                            <img th:if="${searchUserinfo.photo != null and searchUserinfo.isGoogle == false}" th:src="@{'/resources/img/users/' + ${searchUserinfo.username} + '/profile/' + ${searchUserinfo.photo}}" alt="">
                                                            <img th:if="${searchUserinfo.photo != null and searchUserinfo.isGoogle == true}" th:src="${searchUserinfo.photo}" alt="">
                                                        </a>
                                                    </div>
                                                    <div>
                                                        <a th:href="@{/posts_sub/{user}(user = ${searchUsername})}">
                                                            <b class="description-handshakes-user">
                                                                <span th:text="${searchUsername}"></span>
                                                            </b>
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                </div>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
            <br>
            <p class="text-center">
                <a th:href="@{/handshakes_search}" th:text="#{text_back_to_search_handshakes}"></a>
            </p>
            <br>
            <!-- Footer -->
            <footer th:insert="fragments.html :: footer"></footer>
        </div>

        <!-- Right Column -->
        <div th:insert="fragments.html :: right-column"></div>
    </div>

</section>

</body>
</html>
