<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="#{page_label_new_post} + ' - ' + #{application_name}"></title>
    <th:block th:include="fragments.html :: header"/>
    <script type="text/javascript" th:src="@{/resources/js/upload_video_change.js}"></script>
</head>

<!-- Navigation -->
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top" th:insert="fragments.html :: navigation"></nav>

<!-- Page Content -->
<section class="main" sec:authorize="isAuthenticated()">
    <div class="wrapper">
        <div class="left-col">
            <div class="frame-title-create-form">
                <p class="logo-title-text-create-form" th:text="#{page_label_new_post}"></p>
            </div>
            <div class="frame-content-create-form">
                <div class="form-create">
                    <form method="POST" th:action="@{/post/new_video}" enctype="multipart/form-data" id="uploadFile">
                        <label>
                            <input class="input-fields" type="file" id="fileInput" onchange="handleFileSelect()" name="file" accept="video/mp4, video/quicktime" style="display: none;">
                            <img class="image-upload-file" id="uploadButton" th:src="@{/resources/img/icons/upload.png}">
                            <img class="image-upload-file" id="uploadedButton" style="display:none;" th:src="@{/resources/img/icons/upload_ok.png}">
                        </label>
                        <textarea id="smile" name="content" class="input-fields" rows="5" th:placeholder="#{input_enter_post_text}" maxlength="255" required></textarea>
                        <div class="smiles-create-form" th:insert="fragments.html :: smiles-in-post"></div>
                        <button type="submit" class="btn-create" th:text="#{button_publish_a_post}"></button>
                    </form>
                </div>
            </div>

            <!-- Footer -->
            <footer th:insert="fragments.html :: footer"></footer>
        </div>

        <!-- Right Column -->
        <div th:insert="fragments.html :: right-column"></div>
    </div>
</section>

</body>
</html>
