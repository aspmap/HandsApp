<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title id="pageTitle" th:text="#{application_name} + ' - ' + #{page_label_new_post}"></title>
    <th:block th:include="fragments.html :: header"/>
</head>

<script type="text/javascript" th:src="@{/resources/js/smiles.js}"></script>

<!-- Navigation -->
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top" th:insert="fragments.html :: navigation"></nav>
<br><br>

<!-- Page Content -->
<section class="main-post">
    <div class="wrapper-posts">
        <div class="left-col">
            <form method="POST" th:action="@{/post/newVideo}" enctype="multipart/form-data">
                <label>
                    <input type="file" name="file" accept="video/mp4, video/quicktime" style="display: none;">
                    <img id="profilePicture" th:src="@{/resources/img/icons/upload.png}">
                </label>
                <br>
                <textarea id="smile" name="content" class="profile-box description" rows="4" th:placeholder="#{input_enter_post_text}"></textarea>
                <br>
                <button type="submit" class="btn btn-outline-dark" th:text="#{button_publish_a_post}"></button>
            </form>
            <br/>
            <div class="div-smiles" th:insert="fragments.html :: smiles"></div>

            <!-- Footer -->
            <footer th:insert="fragments.html :: footer"></footer>

        </div>
    </div>
</section>

<!-- Bootstrap core JavaScript -->
<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
