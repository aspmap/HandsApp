<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title id="pageTitle" th:text="#{application_name} + ' - ' + #{page_label_editing_a_post}"></title>
    <th:block th:include="fragments.html :: header"/>
</head>

<script type="text/javascript" th:src="@{/resources/js/smiles.js}"></script>

<!-- Navigation -->
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top" th:insert="fragments.html :: navigation"></nav>
<br><br>

<!-- Page Content -->
<section class="main-post">
    <div class="wrapper-posts">
        <div class="left-col">
            <div class="div-smiles" th:insert="fragments.html :: smiles"></div>
            <form method="POST" th:action="@{/post/edit}" th:object="${post}" enctype="multipart/form-data">
                <input type="hidden" th:field="*{postId}"/>
                <textarea id="smile" th:field="*{content}" class="profile-box description" rows="4" th:placeholder="#{input_enter_post_text}"></textarea>
                <br>
                <button type="submit" class="btn btn-outline-dark" th:text="#{button_edit_post}"></button>
            </form>

            <!-- Footer -->
            <footer th:insert="fragments.html :: footer"></footer>

        </div>
    </div>
</section>

<!-- Bootstrap core JavaScript -->
<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
