<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="#{page_label_user_profile} + ' ' + ${user_sub} + ' - ' + #{application_name}" ></title>
    <th:block th:include="fragments.html :: header"/>
</head>

<!-- Navigation -->
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top" th:insert="fragments.html :: navigation"></nav>

<!-- Page Content -->
<section class="main-post" sec:authorize="isAuthenticated()">
    <div class="wrapper-posts">
        <div class="left-col">
            <section class="text-center">
                <div class="info-main">
                    <div class="user-main">
                        <div class="profile-pic-main">
                            <img th:if="${userinfo_sub.photo == null}" th:src="@{'/resources/img/icons/avatar.jpg'}" alt="">
                            <img th:if="${userinfo_sub.photo != null and userinfo_sub.isGoogle == false}" th:src="@{'/resources/img/users/' + ${user_sub} + '/profile/' + ${userinfo_sub.photo}}" alt="">
                            <img th:if="${userinfo_sub.photo != null and userinfo_sub.isGoogle == true}" th:src="${userinfo_sub.photo}" alt="">
                        </div>
                        <div>
                            <p th:if="${userinfo_sub.isGoogle == false}" class="username-main gradient" th:text="${user_sub}"></p>
                            <p th:if="${userinfo_sub.isGoogle == true}" class="username-main gradient" th:text="${userinfo_sub.email}"></p>
                            <p class="description-main" th:if="${userinfo_sub.surname != null && userinfo_sub.firstname != null}" th:text="${userinfo_sub.surname} + ' ' + ${userinfo_sub.firstname}"></p>
                            <p class="description-buttons-main">
                                <a th:href="@{/dialogs/{usernameCompanion}(usernameCompanion = ${user_sub})}" th:if="${!user_sub.equals(user) && isClosedProfile == false}" class="btn-create" th:text="#{button_dialog}"></a>
                                <a th:if="${isSub == 0 && !user.equals(user_sub) && isClosedProfile == false}" th:href="@{/page/subscription/{user}(user = ${user_sub})}" class="btn-create" th:text="#{button_subscribe}"></a>
                                <a th:if="${isSub != 0 && !user.equals(user_sub) && isClosedProfile == false}" th:href="@{/page/unsubscription/{user}(user = ${user_sub})}" class="btn-delete" th:text="#{button_unsubscribe}"></a>
                                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/user_profile_delete/{user}(user = ${user_sub})}" class="btn-delete" th:text="#{button_delete_user_profile}"></a>
                                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/profile_edit/{user}(user = ${user_sub})}" class="btn-delete" th:text="#{button_edit_profile}"></a>
                            </p>
                            <p th:if="${userinfo_sub.www != null}" class="description-main">
                                <span th:text="#{label_site}"></span>
                                <a th:href="${userinfo_sub.www}"><span th:text="${userinfo_sub.www}"></span></a>
                            </p>
                            <p th:if="${userinfo_sub.lastVisit != null}" class="description-main">
                                <span th:text="#{label_visit}"></span>
                                <span th:text="${#temporals.format(userinfo_sub.lastVisit, 'dd.MM.yyyy')} + ' ' + #{text_date_year} + ' ' + ${#temporals.format(userinfo_sub.lastVisit, 'hh:mm')}"></span>
                            </p>
                            <p class="description-main">
                                <span th:text="${countPosts} + ' ' + #{label_publications}"></span>
                                <a th:href="@{/subscribers_their/{user}(user = ${user_sub})}">
                                    <span th:text="${countSubscribers} + ' ' + #{label_subscribers}"></span>
                                </a>
                                <a th:href="@{/subscriptions_their/{user}(user = ${user_sub})}">
                                    <span th:text="${countSubscribe} + ' ' + #{label_subscriptions}"></span>
                                </a>
                            </p>
                            <p class="description-main" th:if="${!user_sub.equals(user)}">
                                <a th:href="@{/wishlists/wishlist_subscriber/{user}(user = ${user_sub})}">
                                    <span th:text="#{text_wishlist_sub}"></span>
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </section>
            <div class="post">
                <div class="post-content">
                    <div class="view-source comments-view">
                        <div class="row">
                            <div class="no_public" th:if="${countPosts == 0}" >
                                <img th:src="@{'/resources/img/icons/face.png'}" alt="">
                                <h1 class="h3 mb-3 font-weight-normal no_public" th:text="#{text_no_posts_yet}"></h1>
                            </div>

                            <div class="no_public" th:if="${isClosedProfile == true}">
                                <img th:src="@{'/resources/img/icons/close.png'}" alt="">
                                <h1 class="h3 mb-3 font-weight-normal no_public" th:text="#{text_closed_profile}"></h1>
                            </div>

                            <div th:if="${countPosts > 0 && isClosedProfile == false}" class="col-md-4" th:each="post: ${posts}" th:id="'post-' + ${post.postId}">
                                <a th:href="@{/posts_subscriber/{user}#post- (user = ${user_sub})} + ${post.postId}">
                                    <div class="card mb-4">
                                        <img th:if="${(post.extFile == 'png' || post.extFile == 'jpg') && post.storageType != 'S3'}" th:src="@{'/resources/img/users/' + ${post.user.username} + '/' + ${post.photo}}">
                                        <img th:if="${(post.extFile == 'png' || post.extFile == 'jpg') && post.storageType == 'S3'}" th:src="@{${post.photo}}">
                                        <video th:if="${post.extFile == 'mp4' || post.extFile == 'mov'}" height="100%" autoplay controls loop muted>
                                            <source th:src="@{'/resources/video/users/' + ${post.user.username} + '/' + ${post.photo}}" type=video/mp4>
                                        </video>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer th:insert="fragments.html :: footer"></footer>
        </div>
    </div>
</section>

</body>
</html>
