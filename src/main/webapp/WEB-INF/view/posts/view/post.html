<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="#{page_label_view_post} + ' - ' + #{application_name}"></title>
    <th:block th:include="fragments.html :: header"/>
</head>

<!-- Navigation -->
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top" th:insert="fragments.html :: navigation"></nav>

<!-- Page Content -->
<section class="main" sec:authorize="isAuthenticated()">
    <div class="wrapper">
        <div class="left-col">
            <div class="post" th:object="${post}">
                <input type="hidden" th:field="*{postId}"/>
                <div class="info">
                    <table class="table-post">
                        <tr>
                            <td class="td-post-photo">
                                <div class="user">
                                    <div class="profile-pic">
                                        <a th:href="@{/page/{user}(user = ${post.user.username})}">
                                            <img th:if="${post.user.photo == null}" th:src="@{'/resources/img/icons/avatar.jpg'}" alt="">
                                            <img th:if="${post.user.photo != null and post.user.isGoogle == false}" th:src="@{'/resources/img/users/' + ${post.user.username} + '/profile/' + ${post.user.photo}}" alt="">
                                            <img th:if="${post.user.photo != null and post.user.isGoogle == true}" th:src="${post.user.photo}" alt="">
                                            <!-- FIXME В ${user} заменить на post.user.username. Проверить везде и затем на самих страницах поменяв пользователя -->
                                        </a>
                                    </div>
                                    <a th:href="@{/page/{user}(user = ${post.user.username})}">
                                        <p th:if="${post.user.isGoogle == false}" class="username" th:text="${post.user.username}"></p>
                                        <p th:if="${post.user.isGoogle == true}" class="username" th:text="${post.user.email}"></p>
                                    </a>
                                </div>
                            </td>
                            <td class="td-post-icon-edit">
                                <a th:if="${#authentication.name == post.user.username}" th:href="@{/post/edit/{postId} (postId = ${post.postId})}">
                                    <img th:src="@{/resources/img/nav/option.png}" class="options" alt="">
                                </a>
                            </td>
                            <td class="td-post-icon-delete">
                                <a th:if="${#authentication.name == post.user.username}" th:href="@{/post/delete_one_post/{postId} (postId = ${post.postId})}">
                                    <img th:src="@{/resources/img/nav/delete.png}" class="options" alt="">
                                </a>
                            </td>
                        </tr>
                    </table>
                </div>
                <img th:if="${(post.extFile == 'png' || post.extFile == 'jpg') && post.storageType != 'S3'}" th:src="@{'/resources/img/users/' + ${post.user.username} + '/' + ${post.photo}}" class="post-image" alt="">
                <img th:if="${(post.extFile == 'png' || post.extFile == 'jpg') && post.storageType == 'S3'}" th:src="@{${post.photo}}" class="post-image" alt="">
                <video th:if="${post.extFile == 'mp4' || post.extFile == 'mov'}" width="100%" autoplay controls loop muted>
                    <source th:src="@{'/resources/video/users/' + ${post.user.username} + '/' + ${post.photo}}" type=video/mp4>
                </video>
                <div class="post-content">
                    <div class="reaction-wrapper">
                        <a th:if="${isLike != 0}" th:href="@{/likes/delete/{postId}(postId = ${post.postId})}">
                            <img th:src="@{/resources/img/icons/like.png}" class="icon" alt="">
                        </a>
                        <a th:if="${isLike == 0}" th:href="@{/likes/create/{postId}(postId = ${post.postId})}">
                            <img th:src="@{/resources/img/icons/notlike.png}" class="icon" alt="">
                        </a>
                        <a th:href="@{/comments/{postId}(postId = ${post.postId})}">
                            <img th:src="@{/resources/img/nav/comment.png}" class="icon" alt="">
                        </a>
                    </div>
                    <p th:if="${countLikes != 0}" class="likes" th:text="#{label_likes} + ': ' + ${countLikes}"></p>
                    <b class="description">
                        <span th:if="${userinfo.isGoogle == false}" th:text="${post.user.username}"></span>
                        <span th:if="${userinfo.isGoogle == true}" th:text="${post.user.email}"></span>
                    </b>
                    <span class="description" th:text="${post.content}"></span>
                    <p class="post-time" th:text="${#temporals.format(post.createdAt, 'dd.MM.yyyy')} + ' ' + #{text_date_year}"></p>

                    <!-- Comments -->
                    <div class="view-source comments-view">
                        <a th:href="@{/comments/comments_subscriber/{postId}(postId = ${post.postId})}" th:each="like, state : ${post.comments}" class="description comments" th:text="${state.last} ? #{label_see_all_comments} + ' (' + ${state.count} + ')' : ''"></a>
                    </div>
                </div>

                <!-- Comments Form -->
                <div sec:authorize="hasAnyRole('USER')">
                    <div class="div-smiles-messages" th:insert="fragments.html :: smiles-in-comments"></div>
                    <form class="comment-wrapper" method="POST" th:action="@{/comments/create}">
                        <input type="hidden" name="postId" th:value="${post.postId}" />
                        <input id="smile" th:if="${userinfo.isGoogle == false}" type="text" class="comment-box description" name="commentText"  th:placeholder="#{input_comment_like} + ' ' + ${user} + '...'" maxlength="255" required>
                        <input id="smile" th:if="${userinfo.isGoogle == true}" type="text" class="comment-box description" name="commentText"  th:placeholder="#{input_comment_like} + ' ' + ${userinfo.email} + '...'" maxlength="255" required>
                        <br>
                        <button class="comment-btn" th:text="#{button_publish}"></button>
                    </form>
                </div>
            </div>

            <!-- Footer -->
            <footer th:insert="fragments.html :: footer"></footer>
        </div>

        <!-- Right Column -->
        <div th:insert="fragments.html :: right-column"></div>
    </div>
</section>

</body>
</html>
