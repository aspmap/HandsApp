<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title id="pageTitle" th:text="#{page_label_new_post_s3} + ' - ' + #{application_name}"></title>
    <th:block th:include="fragments.html :: header-add-img"/>
</head>

<!-- Navigation -->
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top" th:insert="fragments.html :: navigation-add-img"></nav>

<!-- Page Content -->
<section class="main">
    <div sec:authorize="isAuthenticated()" class="wrapper">
        <div class="left-col">
            <div class="frame-title-create-form">
                <p class="logo-title-text-create-form" th:text="#{page_label_new_post}"></p>
            </div>
            <div class="frame-content-create-form">
                <div class="form-create">
                    <form method="POST" th:action="@{/post/newS3Image}" enctype="multipart/form-data">
                        <textarea id="blob-img" name="file" class="input-fields" rows="4" placeholder="" style="display:none;"></textarea>
                        <div>
                            <img class="image-upload-file" id="profilePicture" th:src="@{/resources/img/icons/upload.png}" data-target="#profileImageModal" data-toggle="modal">
                        </div>

                        <!-- Modal Window -->
                        <div th:insert="fragments.html :: modal-window"></div>
                        <!-- Modal Window End -->

                        <textarea id="smile" name="content" class="input-fields" rows="4" th:placeholder="#{input_enter_post_text}"></textarea>
                        <div class="smiles-create-form" th:insert="fragments.html :: smiles-in-post"></div>
                        <button type="submit" class="btn-create" th:text="#{button_publish_a_post}"></button>
                    </form>
                </div>
            </div>

            <!-- Footer -->
            <footer th:insert="fragments.html :: footer"></footer>
        </div>

        <!-- Right Column -->
        <div th:insert="fragments.html :: right-column"></div>
    </div>
</section>

</body>
</html>
