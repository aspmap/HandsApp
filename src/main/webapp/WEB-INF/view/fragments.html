<!-- Navigation -->
<nav class="navbar" th:fragment="navigation">

            <input type="text" class="search-box" name="search" th:placeholder="#{input_find}">
        </form>
        <div class="nav-items">
            <a class="icon" id="home-icon" sec:authorize="isAuthenticated()" th:href="@{/}">

            <a class="icon" sec:authorize="isAuthenticated()" th:href="@{/dialogs}">
                <img th:if="${unreadMessagesTotal == 0}" th:src="@{/resources/img/nav/messenger.png}" class="icon" alt="">
                <img th:if="${unreadMessagesTotal > 0}" th:src="@{/resources/img/nav/messenger_unread.png}" class="icon" alt="">

            </a>
            <a class="icon" sec:authorize="isAuthenticated()" th:href="@{/handshakes_search}">
                <img th:src="@{/resources/img/nav/handshakes.png}" class="icon" alt="">
            </a>
            <ul class="nav-list icon" sec:authorize="isAuthenticated()">
                <li class="icon">
                    <img class="icon" th:src="@{/resources/img/nav/add.png}" alt="">
                    <ul class="nalumes-nucludem">
                        <li>
                            <a th:href="@{/post/newImage}">
                                <img th:src="@{/resources/img/nav/photo.png}" class="icon" alt="">
                                <span th:text="#{menu_photo}"></span>
                            </a>
                        </li>
                        <li>
                            <a th:href="@{/post/newS3Image}">
                                <img th:src="@{/resources/img/nav/photo.png}" class="icon" alt="">
                                <span th:text="#{menu_s3_photo}"></span>
                            </a>
                        </li>
                        <li>
                            <a th:href="@{/post/newVideo}">
                                <img th:src="@{/resources/img/nav/video.png}" class="icon" alt="">
                                <span th:text="#{menu_video}"></span>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
            <div class="icon user-profile" sec:authorize="isAuthenticated()">
                <ul class="icon user-profile nav-list" sec:authorize="isAuthenticated()">
                    <li>
                        <img th:if="${userinfo.photo == null}" class="icon user-profile" th:src="@{'/resources/img/icons/avatar.jpg'}" alt="">
                        <img th:if="${userinfo.photo != null and userinfo.isGoogle == false}" class="icon user-profile" th:src="@{'/resources/img/users/' + ${user} + '/profile/' + ${userinfo.photo}}" alt="">

                            <li>
                                <a th:href="@{/posts}"><span th:text="#{menu_profile}"></span></a>
                            </li>
                            <li>
                                <a th:href="@{/profile_edit/{user}(user = ${user})}"><span th:text="#{menu_settings}"></span></a>
                            </li>
                            <li>
                                <a th:href="@{/posts_my_likes}"><span th:text="#{menu_my_likes}"></span></a>
                            </li>
                            <li>
                                <a th:href="@{/music}"><span th:text="#{menu_my_music}"></span></a>
                            </li>
                            <li>
                                <a th:href="@{/todo}"><span th:text="#{menu_my_todo_list}"></span></a>
                            </li>
                            <li>
                                <a th:href="@{/wishlist}"><span th:text="#{menu_my_wishlist}"></span></a>
                            </li>
                            <li>
                                <a th:href="@{/qrcode/}"><span th:text="#{menu_qrcode}"></span></a>
                            </li>
                            <li>
                                <a th:href="@{/posts_ms/}"><span th:text="#{menu_my_posts_ms}"></span></a>
                            </li>
                            <li>
                                <a th:href="@{/pagination}"><span th:text="#{menu_my_pagination}"></span></a>
                            </li>
                            <li>
                                <a th:href="@{/profile_archive}"><span th:text="#{menu_my_archive}"></span></a>
                            </li>
                            <li>
                                <a th:href="@{/logout}"><span th:text="#{menu_logout}"></span></a>
                            </li>
                            <b sec:authorize="hasRole('ADMIN')" style="margin-left: 5px" th:text="#{menu_admin}"></b>
                            <li sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/bugs_view}"><span th:text="#{menu_bugs}"></span></a>

                        </ul>
                    </li>
                </ul>

<!-- Right Column -->
<div sec:authorize="!isAuthenticated()" th:fragment="right-column-unauth">
    <div class="image-container">
        <img th:src="@{/resources/img/login/insta-signup-page.png}" alt="HandsApp In Phone Image">
    </div>
</div>

<div sec:authorize="isAuthenticated()" class="right-col" th:fragment="right-column">

    <!-- Recomendations -->
    <p class="suggestion-text"><span th:text="#{text_recommendations_for_you}"></span></p>
    <div class="profile-card" th:each="users: ${usersOnlyKey}" th:if="${!users.username.equals(user)}">
        <div class="profile-pic">
            <a th:href="@{/sub-posts/{user}(user = ${users.username})}">
                <img th:if="${users.photo == ''}" th:src="@{'/resources/img/icons/avatar.jpg'}" alt="">
                <img th:if="${users.photo != '' and users.isGoogle == 'f'}" th:src="@{'/resources/img/users/' + ${users.username} + '/profile/' + ${users.photo}}" alt="">
                <img th:if="${users.photo != '' and users.isGoogle == 't'}" th:src="${users.photo}" alt="">
            </a>
        </div>
        <div>
            <div>
            <a th:href="@{/sub-posts/{user}(user = ${users.username})}">
                <span th:if="${users.isGoogle == 'f'}" th:text="${users.username}" class="username"></span>
                <span th:if="${users.isGoogle == 't'}" th:text="${users.email}" class="username"></span>
            </a>
            <a th:if="${users.isSub == '0'}" th:href="@{/subscription_fr/{user}(user = ${users.username})}" class="sub-btn" th:text="#{button_subscribe}"></a>
            </div>
                <p th:if="${users.surname != null && users.firstname != null}" th:text="${users.surname} + ' ' + ${users.firstname}" class="sub-text"></p>

        </div>
    </div>
</div>
